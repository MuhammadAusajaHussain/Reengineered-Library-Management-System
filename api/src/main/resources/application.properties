spring.application.name=lms-api
server.port=9000

# Logging
logging.level.root=INFO
logging.level.com.lms=DEBUG

# Optional: Tomcat access log (useful in demos/debugging)
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b "%{X-Request-Id}i"

# Embedded Apache Derby setup (auto-creates DB if missing)
spring.datasource.url=jdbc:derby:../Database/LMS_REENGINEERED;create=true
spring.datasource.driver-class-name=org.apache.derby.jdbc.EmbeddedDriver
spring.datasource.username=app
spring.datasource.password=app

# Initialize schema/data from SQL scripts
spring.sql.init.mode=embedded
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# Bootstrap (real DB, no seed data.sql)
# Ensures admin account exists (and can reset its password) for demos.
lms.bootstrap.admin.username=admin
lms.bootstrap.admin.password=admin
lms.bootstrap.admin.full-name=System Admin
lms.bootstrap.admin.reset-password=true
